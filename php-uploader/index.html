<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Advanced PHP Uploader | India Cyber Cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .drop-zone { border: 2px dashed #e2e8f0; transition: all 0.3s ease; }
        .drop-zone.active { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Secure File Upload</h1>
            <p class="text-slate-500 mt-2">Upload your documents securely to India Cyber Cafe</p>
        </div>

        <form id="uploadForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Category</label>
                <input type="text" name="category" required placeholder="e.g., documents, photos, videos" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
            </div>

            <div id="dropZone" class="drop-zone rounded-2xl p-10 text-center cursor-pointer">
                <input type="file" name="file" id="fileInput" class="hidden" required>
                <div id="filePreview" class="space-y-4">
                    <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-slate-700 font-medium">Click to upload or drag and drop</p>
                        <p class="text-slate-400 text-sm mt-1">JPG, PNG, PDF, HEIF, MP4 (Max 10MB)</p>
                    </div>
                </div>
            </div>

            <div id="progressContainer" class="hidden">
                <div class="flex justify-between text-sm mb-1">
                    <span class="text-slate-500">Uploading...</span>
                    <span id="progressText" class="font-bold text-blue-600">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2">
                    <div id="progressBar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
                <span>Start Upload</span>
            </button>
        </form>

        <div id="response" class="mt-6 hidden"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const form = document.getElementById('uploadForm');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const responseDiv = document.getElementById('response');
        const submitBtn = document.getElementById('submitBtn');

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = () => dropZone.classList.remove('active');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updatePreview(e.dataTransfer.files[0]);
            }
        };

        fileInput.onchange = () => {
            if (fileInput.files.length) updatePreview(fileInput.files[0]);
        };

        function updatePreview(file) {
            const preview = document.getElementById('filePreview');
            preview.innerHTML = `
                <div class="text-blue-600 font-bold">${file.name}</div>
                <div class="text-slate-400 text-xs">${(file.size / (1024 * 1024)).toFixed(2)} MB</div>
                <button type="button" onclick="location.reload()" class="text-red-500 text-xs underline">Remove</button>
            `;
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Processing...';
            progressContainer.classList.remove('hidden');
            responseDiv.classList.add('hidden');

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'upload.php', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressText.innerText = percent + '%';
                }
            };

            xhr.onload = () => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Start Upload';
                const result = JSON.parse(xhr.responseText);
                
                responseDiv.classList.remove('hidden');
                if (result.status === 'success') {
                    responseDiv.innerHTML = `
                        <div class="bg-green-50 border border-green-200 p-4 rounded-xl">
                            <p class="text-green-700 font-bold">Upload Successful!</p>
                            <p class="text-green-600 text-sm mt-1">File: ${result.stored_file_name}</p>
                            <a href="${result.file_url}" target="_blank" class="text-blue-600 text-sm underline mt-2 block">View File</a>
                        </div>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <div class="bg-red-50 border border-red-200 p-4 rounded-xl">
                            <p class="text-red-700 font-bold">Upload Failed</p>
                            <p class="text-red-600 text-sm mt-1">${result.message}</p>
                        </div>
                    `;
                }
            };

            xhr.send(formData);
        };
    </script>
</body>
</html>
